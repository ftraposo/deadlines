<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departures — Deadline Board</title>
<style>
  :root{
    --board-bg: #14161c;
    --board-rail: #0b0c10;
    --tile-bg: #1f232c;
    --tile-bg-2: #262b36;
    --tile-text: #eef0e5;
    --tile-shadow: rgba(0,0,0,0.55);
    --amber: #e8a33d;
    --amber-dim: #a5732a;
    --red: #d9603b;
    --line: #333947;
    --muted: #7b8394;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--board-bg);
    color: var(--tile-text);
    font-family: 'Work Sans', 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
  }

  .wrap{
    max-width: 920px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  header{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 2px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 28px;
  }

  header h1{
    font-family: 'Space Mono', 'Courier New', monospace;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 0.5px;
    margin: 0;
    color: var(--tile-text);
  }

  header .clock{
    font-family: 'Space Mono', 'Courier New', monospace;
    color: var(--muted);
    font-size: 0.95rem;
  }

  /* --- Add task form --- */
  .add-row{
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--tile-bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 34px;
  }

  .add-row input{
    background: var(--board-rail);
    border: 1px solid var(--line);
    color: var(--tile-text);
    border-radius: 4px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.95rem;
  }

  .add-row input[type="text"]{ flex: 1 1 220px; }
  .add-row input[type="datetime-local"]{ flex: 1 1 200px; }

  .add-row button{
    background: var(--amber);
    color: #1a1305;
    border: none;
    border-radius: 4px;
    padding: 10px 18px;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .add-row button:hover{ background: #f2b658; }

  /* --- Board --- */
  .board-head{
    display:grid;
    grid-template-columns: 1fr auto auto;
    gap: 18px;
    padding: 0 4px 10px;
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 6px;
  }

  .board-head .destination-label{ }
  .board-head .eta-label{ justify-self: end; padding-right: 6px; }

  .row{
    display:grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 18px;
    padding: 16px 4px;
    border-bottom: 1px solid var(--line);
  }

  .row.overdue .task-name{ color: var(--red); }
  .row.overdue .flap-block .flap.digit{ color: var(--red); }

  .task-name{
    font-size: 1.05rem;
    font-weight: 600;
    overflow-wrap: anywhere;
  }

  .task-meta{
    display:block;
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 3px;
    font-family: 'Space Mono', monospace;
  }

  .flap-cluster{
    display:flex;
    gap: 10px;
    align-items: flex-end;
  }

  .flap-block{
    display:flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .flap-block .unit-label{
    font-size: 0.62rem;
    letter-spacing: 1.5px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .flap{
    background: linear-gradient(180deg, var(--tile-bg) 0%, var(--tile-bg-2) 100%);
    color: var(--amber);
    font-family: 'Space Mono', 'Courier New', monospace;
    font-weight: 700;
    font-size: 1.4rem;
    min-width: 2.4ch;
    text-align: center;
    padding: 6px 4px;
    border-radius: 3px;
    box-shadow: inset 0 -3px 0 var(--tile-shadow), 0 1px 0 rgba(255,255,255,0.03);
    position: relative;
  }

  .flap::after{
    content:"";
    position:absolute;
    left:0; right:0; top:50%;
    height:1px;
    background: rgba(0,0,0,0.4);
  }

  .remove-btn{
    justify-self: end;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 4px;
    width: 30px;
    height: 30px;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .remove-btn:hover{
    border-color: var(--red);
    color: var(--red);
  }

  .empty-state{
    padding: 50px 10px;
    text-align: center;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.9rem;
    border: 1px dashed var(--line);
    border-radius: 6px;
  }

  footer{
    margin-top: 40px;
    color: var(--muted);
    font-size: 0.75rem;
    text-align: center;
    font-family: 'Space Mono', monospace;
  }

  @media (max-width: 620px){
    .row, .board-head{ grid-template-columns: 1fr; row-gap: 10px; }
    .board-head .eta-label{ justify-self: start; }
    .remove-btn{ justify-self: start; }
    .flap-cluster{ justify-content: flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DEPARTURES</h1>
    <div class="clock" id="nowClock"></div>
  </header>

  <form class="add-row" id="addForm">
    <input type="text" id="taskName" placeholder="Task name" required maxlength="60">
    <input type="datetime-local" id="taskDeadline" required>
    <button type="submit">Add deadline</button>
  </form>

  <div class="board-head">
    <div class="destination-label">TASK</div>
    <div class="eta-label" style="justify-self:center;">TIME REMAINING</div>
    <div></div>
  </div>

  <div id="board"></div>

  <div class="empty-state" id="emptyState" style="display:none;">
    No deadlines on the board. Add one above.
  </div>

  <footer>Board updates every minute · stored in this browser</footer>
</div>

<script>
  const STORAGE_KEY = 'deadline-board-tasks';

  function loadTasks(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }

  function saveTasks(tasks){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  let tasks = loadTasks();

  function uid(){
    return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
  }

  function pad(n){
    return String(n).padStart(2, '0');
  }

  function diffParts(deadlineMs){
    const now = Date.now();
    let diff = deadlineMs - now;
    const overdue = diff < 0;
    diff = Math.abs(diff);

    const minuteMs = 60000;
    const hourMs = 60 * minuteMs;
    const dayMs = 24 * hourMs;

    const days = Math.floor(diff / dayMs);
    const hours = Math.floor((diff % dayMs) / hourMs);
    const minutes = Math.floor((diff % hourMs) / minuteMs);

    return { days, hours, minutes, overdue };
  }

  function renderBoard(){
    const board = document.getElementById('board');
    const emptyState = document.getElementById('emptyState');

    const sorted = [...tasks].sort((a,b) => a.deadline - b.deadline);

    if(sorted.length === 0){
      board.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    board.innerHTML = sorted.map(task => {
      const { days, hours, minutes, overdue } = diffParts(task.deadline);
      const deadlineDate = new Date(task.deadline);
      const deadlineStr = deadlineDate.toLocaleString(undefined, {
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      });

      return `
        <div class="row ${overdue ? 'overdue' : ''}" data-id="${task.id}">
          <div>
            <div class="task-name">${escapeHtml(task.name)}</div>
            <span class="task-meta">${overdue ? 'was due' : 'due'} ${deadlineStr}</span>
          </div>
          <div class="flap-cluster">
            <div class="flap-block">
              <div class="flap digit">${pad(days)}</div>
              <div class="unit-label">DAYS</div>
            </div>
            <div class="flap-block">
              <div class="flap digit">${pad(hours)}</div>
              <div class="unit-label">HRS</div>
            </div>
            <div class="flap-block">
              <div class="flap digit">${pad(minutes)}</div>
              <div class="unit-label">MIN</div>
            </div>
          </div>
          <button class="remove-btn" title="Remove ${escapeHtml(task.name)}" data-remove="${task.id}">✕</button>
        </div>
      `;
    }).join('');

    board.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-remove');
        tasks = tasks.filter(t => t.id !== id);
        saveTasks(tasks);
        renderBoard();
      });
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    const nameInput = document.getElementById('taskName');
    const deadlineInput = document.getElementById('taskDeadline');

    const name = nameInput.value.trim();
    const deadlineVal = deadlineInput.value;
    if(!name || !deadlineVal) return;

    const deadlineMs = new Date(deadlineVal).getTime();

    tasks.push({ id: uid(), name, deadline: deadlineMs });
    saveTasks(tasks);
    renderBoard();

    nameInput.value = '';
    deadlineInput.value = '';
    nameInput.focus();
  });

  function updateClock(){
    const now = new Date();
    document.getElementById('nowClock').textContent = now.toLocaleString(undefined, {
      weekday: 'short', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  renderBoard();
  updateClock();
  setInterval(() => { renderBoard(); updateClock(); }, 60000);
</script>
</body>
</html>
